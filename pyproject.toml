[project]
name = "ninecgpa-backend"
version = "0.1.0"
description = "9CGPA career preparation API"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.15,<2.0",
    "argon2-cffi>=25.1,<26.0",
    "email-validator>=2.2,<3.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "PyJWT>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "SQLAlchemy>=2.0.38,<2.1",
    "uvicorn>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2.0",
    "pytest>=8.3,<10.0",
    "ruff>=0.11,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: requires a dedicated PostgreSQL test database"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".uv-cache", ".python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
